<!DOCTYPE html>
<html>
<head>

<style>body { background: #ffffff; margin: 0; font-family: 'Open Sans', sans-serif; }
.choice-row { display:flex; align-items:center; gap:14px; padding:16px 18px; border:1px solid #dddddd; border-radius:14px; background:#ffffff; cursor:pointer; margin-bottom:10px; }
.choice-row.selected { border:2px solid #002C64; }
.choice-row.correct { border:2px solid #32CD32; }
.badge { flex:0 0 auto; width:32px; height:32px; border-radius:20px; background:#002C64; color:#ffffff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px; }
.check { margin-left:auto; width:26px; height:26px; border-radius:50%; background:#002C64; color:#ffffff; display:flex; align-items:center; justify-content:center; font-size:14px; }
.check.correct { background:#32CD32; }
.level-opt:hover { background:#f5f5f5; }
@media (max-width: 450px) {
  #prompt { font-size: 14px !important; }
  #promptEquation { font-size: 15px !important; }
  #qNum, #qTotal { font-size: 12px !important; }
  span:has(#qNum) { font-size: 11px !important; }
  .badge { width: 26px !important; height: 26px !important; font-size: 11px !important; }

  .choice-row div:not(.badge) { font-size: 13px !important; }

}
@media (min-width: 451px) {
  #container { max-width: 600px; margin: 0 auto; }}</style></head>


<body>

<div id="container" style="padding: 1.5rem 1rem;">

<!-- Practice -->
<div id="practiceStrip">
<div style="display:flex; justify-content:space-between; align-items:center; margin: 0 0.2rem 1.2rem 0rem;">
<span style="font-size:16px; color:#999999; font-weight:500;">Question <span id="qNum">1</span> of <span id="qTotal">10</span></span>
<span id="levelLabel" style="color:#777777; font-size:13px; font-weight:600;">Level <span id="levelNum">1</span></span></div>


<div id="prompt" style="text-align: left; font-size: 20px; font-weight: 500; color: #002C64; margin: 0 0 1rem 0; line-height: 1.5;"></div>
<div id="promptEquation" style="text-align: left; font-size: 20px; font-weight: 500; color: #002C64; margin: 0 0 1.5rem 0; line-height: 1.5;"></div>
<div id="choices"></div>
<p id="feedback" style="text-align: center; font-size: 15px; margin: 0.5rem 0 1rem 0; min-height: 18px;"></p>
<div style="display:flex; justify-content:space-between; border-top:1px solid #eeeeee; padding-top:1rem;">
<button id="prev-btn" style="padding:12px 20px; border:1px solid #aaaaaa; border-radius:10px; background:#ffffff; cursor:pointer; color:#888888; font-size:15px;">&larr; Previous</button>
<button id="next-btn" style="padding:12px 20px; border:none; border-radius:10px; background:#002C64; cursor:pointer; color:#ffffff; font-size:15px; font-weight:500;">Next &rarr;</button></div></div></div>
<button id="reveal-btn" style="display:block; margin: 0 auto 1.5rem auto; padding:8px 14px; border:1px solid #dddddd; border-radius:10px; background:#ffffff; cursor:pointer; color:#888888; font-size:13px;">Reveal explanation</button>
<div id="explanation" style="display: none; margin-bottom: 1.5rem; padding: 1rem 1.1rem; background: #f9f9f9; border-radius: 12px; font-size: 15px; color: #555555; line-height: 1.5;"></div>


<script>
function renderKatex(id, latex) {
  katex.render(latex, document.getElementById(id), { throwOnError: false, displayMode: true });}

/* ---------- Generators (same interface as p1.html) ---------- */
const generators = {
  
additionProperties: {pools: {1: [[1,50],[2,50],[1,40],[5,50],[1,100]],2: [[2,20,'even'],[1,19,'odd'],[10,30,'even'],[1,29,'odd'],[4,40,'even']], 3: [[1,30,3],[1,40,4],[1,50,5],[1,60,3],[1,80,4]]},
    generateProblem(difficulty) {const pool = this.pools[difficulty];const params = pool[Math.floor(Math.random() * pool.length)];
    if (difficulty === 1) {const [start, end] = params;return { difficulty, start, end,prompt: `What is the sum of all integers from ${start} through ${end}, inclusive?` };
    }if (difficulty === 2) {const [start, end, parity] = params;return { difficulty, start, end, parity,prompt: `What is the sum of all ${parity} integers from ${start} through ${end}, inclusive?` };
    }const [start, end, k] = params;return { difficulty, start, end, k,prompt: `What is the sum of all multiples of ${k} from ${start} through ${end}, inclusive?` };
    },
    // --- helpers ---
    boundsFor(p) {if (p.difficulty === 1) return { first: p.start, last: p.end, step: 1 };if (p.difficulty === 2) {
      const wantEven = p.parity === 'even';const first = (p.start % 2 === 0) === wantEven ? p.start : p.start + 1;const last = (p.end % 2 === 0) === wantEven ? p.end : p.end - 1;return { first, last, step: 2 };
    }const first = Math.ceil(p.start / p.k) * p.k;const last = Math.floor(p.end / p.k) * p.k;return { first, last, step: p.k };  },
    correctAnswer(p) {const { first, last, step } = this.boundsFor(p);const n = Math.floor((last - first) / step) + 1;return (n / 2) * (first + last);  },
    distractors(p, answer) {const { first, last, step } = this.boundsFor(p);const n = Math.floor((last - first) / step) + 1;
    if (p.difficulty === 1) {return [
        Math.round(((n - 1) / 2) * (p.start + p.end)),   // off-by-one on count
        Math.round(p.start + p.end),                       // forgot to multiply by pairs
        Math.round(answer + (p.start + p.end) / 2)          // extra half-pair added
      ];}if (p.difficulty === 2) {const nAll = Math.floor((p.end - p.start) / 1) + 1;
      return [
        Math.round((nAll / 2) * (p.start + p.end)),         // forgot to filter parity
        Math.round(answer - first),                          // off-by-one on first qualifying term
        Math.round(answer - step)                            // off-by-one on last qualifying term
      ];}return [Math.round((n / 2) * ((n - 1) * step)),               // wrong step used in pairing
      Math.round(answer - first),                            // forgot to snap start up
      Math.round(answer + (p.end - last))                    // used raw endpoint instead of snapped last
    ];},
    explain(p, answer) {const { first, last, step } = this.boundsFor(p);const n = Math.floor((last - first) / step) + 1;
    if (p.difficulty === 1) {return `Pair the first and last: ${p.start} + ${p.end} = ${p.start + p.end}. ` +
        `There are ${n} numbers, forming ${n / 2} pairs. Sum = ${n / 2} &times; ${p.start + p.end} = ${answer}.`;
    }if (p.difficulty === 2) {return `First isolate the qualifying ${p.parity} terms: first is ${first}, last is ${last}. ` +
        `Step size is 2, so there are ${n} terms. Pair ends inward: ${first} + ${last} = ${first + last}, ` +
        `giving ${n / 2} pairs. Sum = ${n / 2} &times; ${first + last} = ${answer}.`;
    }return `Snap the range to multiples of ${p.k}: first is ${first}, last is ${last}. ` +
      `This is a scaled arithmetic sequence (step = ${p.k}) with ${n} terms &mdash; ` +
      `pull out a factor of ${p.k} and it reduces to the same pairing insight. ` +
      `Sum = ${n / 2} &times; ${first + last} = ${answer}.`;}},

  
isoscelesTriangleProperties: {
      // Level 1: \u2220A \u2245 \u2220C, \u2220B given \u2192 Angle Sum Theorem
    level1Pool: [{ B: 20 },{ B: 40 },{ B: 60 },{ B: 80 },{ B: 100 },{ B: 120 },{ B: 140 },{ B: 44 },{ B: 64 },{ B: 84 },{ B: 104 }],
      // Level 2: \u2220A \u2245 \u2220C, exterior \u2220B given \u2192 Exterior Angle Theorem
    level2Pool: [{ extB: 40 },{ extB: 60 },{ extB: 80 },{ extB: 100 },{ extB: 120 },{ extB: 44 },{ extB: 68 },{ extB: 76 },{ extB: 92 },{ extB: 108 },{ extB: 124 }],
      // Level 3: \u2220A \u2245 \u2220C, BD bisects \u2220B, \u2220ABD = mx, \u2220A = 2x + k \u2192 Angle Bisector + Angle Sum
    level3Pool: [{ k: 5, m: 3, x: 17, A: 39 },{ k: 6, m: 1, x: 28, A: 62 },{ k: 6, m: 2, x: 21, A: 48 },
      { k: 6, m: 4, x: 14, A: 34 },{ k: 6, m: 5, x: 12, A: 30 },{ k: 9, m: 1, x: 27, A: 63 },
      { k: 9, m: 7, x: 9, A: 27 },{ k: 10, m: 2, x: 20, A: 50 },{ k: 10, m: 3, x: 16, A: 42 },
      { k: 10, m: 6, x: 10, A: 30 },{ k: 13, m: 5, x: 11, A: 35 },{ k: 18, m: 4, x: 12, A: 42 },
      { k: 18, m: 6, x: 9, A: 36 },{ k: 18, m: 7, x: 8, A: 34 }],
    generateProblem(difficulty) { const pool = this['level' + difficulty + 'Pool'];const chosen = pool[Math.floor(Math.random() * pool.length)];
    if (difficulty === 1) { const { B } = chosen; return { ...chosen, difficulty, prompt: 'In \\(\\triangle ABC\\), \\(\\angle A \\cong \\angle C\\), and \\(\\angle B = ' + B + '^\\circ\\). Find \\(\\angle A\\).' };}
    if (difficulty === 2) { const { extB } = chosen; return { ...chosen, difficulty, prompt: 'In \\(\\triangle ABC\\), \\(\\angle A \\cong \\angle C\\). The exterior angle at B measures ' + extB + '^\\circ. Find \\(\\angle A\\).' };
    } const { k, m } = chosen;return { ...chosen, difficulty, prompt: 'In \\(\\triangle ABC\\), \\(\\angle A \\cong \\angle C\\). BD bisects \\(\\angle B\\). \\(\\angle ABD = ' + m + 'x\\), \\(\\angle A = 2x + ' + k + '\\). Find \\(\\angle A\\).' };},
    correctAnswer(p) {if (p.difficulty === 1) return (180 - p.B) / 2;
    if (p.difficulty === 2) return p.extB / 2; return p.A;},
    distractors(p, answer) { const set = new Set([answer]); let candidates;
    if (p.difficulty === 1) { candidates = [
        180 - p.B,           // forgot to halve the remainder
        p.B / 2,             // halved \u2220B instead of the remainder
        answer + 10,         // generic near-miss
      ]; } else if (p.difficulty === 2) { candidates = [
        (180 - p.extB) / 2,  // treated exterior \u2220B as interior \u2220B
        p.extB,              // forgot to halve (gave \u2220A + \u2220C combined)
        (180 - p.extB / 2) / 2, // muddled formula
      ]; } else { const wrongX = (180 - 2 * p.k) / (4 + p.m); // forgot bisector doubling
      candidates = [ Math.round(2 * wrongX + p.k),
        p.x,                         // solved for x, forgot to substitute back
        (180 - p.k) / 2,             // misapplied angle sum directly to k
      ]; }const out = []; for (const cand of candidates) { if (Number.isFinite(cand) && cand > 0 && !set.has(cand)) { set.add(cand); out.push(cand); }
      if (out.length === 3) break; } return out;},
    explain(p, answer) { if (p.difficulty === 1) {  return 'Isosceles Triangle Theorem: \\(\\angle A \\cong \\angle C\\), so let both equal \\(\\angle A\\). ' +
        '<br><br>Triangle Angle Sum Theorem: \\(2\\angle A + ' + p.B + '^\\circ = 180^\\circ\\). ' +
        '<br><br>Solve: \\(\\angle A = ' + answer + '^\\circ\\).';
    } if (p.difficulty === 2) { return 'Isosceles Triangle Theorem: \\(\\angle A \\cong \\angle C\\). ' +
        '<br><br>Exterior Angle Theorem: the exterior angle at B equals the sum of the two remote interior angles, \\(\\angle A + \\angle C = ' + p.extB + '^\\circ\\). ' +
        '<br><br>Since \\(\\angle A = \\angle C\\): \\(2\\angle A = ' + p.extB + '^\\circ\\), so \\(\\angle A = ' + answer + '^\\circ\\).';
    } const twoM = 2 * p.m;const coeff = 4 + twoM;  const const2k = 2 * p.k;
    return 'Isosceles Triangle Theorem: \\(\\angle A \\cong \\angle C\\). ' +
      '<br><br>Angle Bisector Definition: BD bisects \\(\\angle B\\), so \\(\\angle B = 2(\\angle ABD) = ' + twoM + 'x\\). ' +
      '<br><br>Triangle Angle Sum Theorem: \\(2(2x + ' + p.k + ') + ' + twoM + 'x = 180\\). ' +
      '<br><br>Simplify: \\(' + coeff + 'x + ' + const2k + ' = 180\\), so \\(x = ' + p.x + '\\). ' +
      '<br><br>Substitute back: \\(\\angle A = 2(' + p.x + ') + ' + p.k + ' = ' + answer + '^\\circ\\).';}},

functionProperties: {        
    // Level 1: forward substitution — x # y = ax + by, given x0,y0 \u2192 compute N
    level1Pool: [{ a: 2, b: 3, x: 4, y: 2, N: 14 },{ a: 3, b: 2, x: 5, y: 1, N: 17 },{ a: 1, b: 4, x: 6, y: 3, N: 18 },{ a: 5, b: 1, x: 2, y: 7, N: 17 },
    { a: 2, b: 1, x: 8, y: 4, N: 20 }, ],
    // Level 2: reverse substitution — x # y = coefA*x + coefB*y, given a # y0 = N \u2192 solve for a
    level2Pool: [{ coefA: 2, coefB: 1, y0: 5, x: 6, N: 17 },{ coefA: 3, coefB: 2, y0: 4, x: 5, N: 23 },{ coefA: 1, coefB: 3, y0: 6, x: 2, N: 20 },{ coefA: 4, coefB: 1, y0: 3, x: 6, N: 27 },
    { coefA: 2, coefB: 5, y0: 2, x: 3, N: 16 },  ],
    // Level 3: underdetermined system — coefA*a + coefB*b = N, multiple valid (a,b); answer = smallest-b solution's a+b
    level3Pool: [{ coefA: 2, coefB: 3, N: 17, a: 4, b: 3, sum: 7 },{ coefA: 3, coefB: 2, N: 19, a: 5, b: 2, sum: 7 }, { coefA: 4, coefB: 1, N: 22, a: 5, b: 2, sum: 7 },
      { coefA: 1, coefB: 4, N: 21, a: 5, b: 4, sum: 9 },{ coefA: 2, coefB: 5, N: 26, a: 3, b: 4, sum: 7 }, ],
    generateProblem(difficulty) {    const pool = this['level' + difficulty + 'Pool']; const chosen = pool[Math.floor(Math.random() * pool.length)];
    if (difficulty === 1) { const { a, b, x, y } = chosen; const bTerm = b === 1 ? 'y' : b + 'y';  const aTerm = a === 1 ? 'x' : a + 'x';
      return { ...chosen, difficulty, prompt: 'If \\(x {\\footnotesize\\#} y = ' + aTerm + ' + ' + bTerm + '\\), what is \\(' + x + ' {\\footnotesize\\#} ' + y + '\\)?' };    }
    if (difficulty === 2) { const { coefA, coefB, y0, N } = chosen; const bTerm = coefB === 1 ? 'y' : coefB + 'y'; const aTerm = coefA === 1 ? 'x' : coefA + 'x';
      return { ...chosen, difficulty, prompt: 'If \\(x {\\footnotesize\\#} y = ' + aTerm + ' + ' + bTerm + '\\) and \\(a {\\footnotesize\\#} ' + y0 + ' = ' + N + '\\), what is the value of \\(a\\)?' };    }
    const { coefA, coefB, N } = chosen; const bTerm = coefB === 1 ? 'y' : coefB + 'y'; const aTerm = coefA === 1 ? 'x' : coefA + 'x';
    return { ...chosen, difficulty, prompt: 'If \\(x {\\footnotesize\\#} y = ' + aTerm + ' + ' + bTerm + '\\), and \\(a {\\footnotesize\\#} b = ' + N + '\\), which of the following could be the value of \\(a + b\\)?' };  },
    correctAnswer(p) {if (p.difficulty === 1) return p.N; if (p.difficulty === 2) return p.x; return p.sum;  },
    distractors(p, answer) { const set = new Set([answer]); let candidates;
    if (p.difficulty === 1) { candidates = [
        p.a * p.y + p.b * p.x,   // swapped which variable gets which coefficient
        p.x + p.y,               // treated # as ordinary addition
        p.b * p.x + p.a * p.y,   // flipped coefficients in the definition itself
      ]; } else if (p.difficulty === 2) {  candidates = [
        Math.round((p.N - p.coefA * p.y0) / p.coefB), // solved for y0's coefficient slot instead of x's
        p.N - p.coefB * p.y0,                          // forgot to divide by coefA
        p.x + p.coefB,                                  // generic near-miss
      ]; } else {
      // other valid (a,b) sums for the same equation, plus one invalid-parity sum
      const alt = []; for (let b = 1; b < p.N; b++) {  const rem = p.N - p.coefB * b;  if (rem > 0 && rem % p.coefA === 0) {  const a = rem / p.coefA;
          if (a + b !== p.sum) alt.push(a + b); }  } candidates = [...alt, p.sum + 1]; } const out = []; for (const cand of candidates) {
      if (Number.isFinite(cand) && cand > 0 && !set.has(cand)) { set.add(cand); out.push(cand); }  if (out.length === 3) break;  }  return out;  },
    explain(p, answer) { if (p.difficulty === 1) {  return 'Definition of the operation: \\(x \\# y = ' + p.a + 'x + ' + p.b + 'y\\). ' +
        '<br><br>Substitute in order \u2014 \\(x = ' + p.x + '\\), \\(y = ' + p.y + '\\): \\(' + p.a + '(' + p.x + ') + ' + p.b + '(' + p.y + ')\\). ' +
        '<br><br>Evaluate: \\(' + (p.a * p.x) + ' + ' + (p.b * p.y) + ' = ' + answer + '\\).';  }
    if (p.difficulty === 2) { return 'Definition of the operation: \\(x \\# y = ' + p.coefA + 'x + ' + p.coefB + 'y\\). ' +
        '<br><br>Substitute the known value into \\(y\\): \\(' + p.coefA + 'a + ' + p.coefB + '(' + p.y0 + ') = ' + p.N + '\\). ' +
        '<br><br>Solve for \\(a\\): \\(' + p.coefA + 'a = ' + p.N + ' - ' + (p.coefB * p.y0) + ' = ' + (p.N - p.coefB * p.y0) + '\\), so \\(a = ' + answer + '\\).';    }
    return 'Definition of the operation: \\(x \\# y = ' + p.coefA + 'x + ' + p.coefB + 'y\\), so \\(' + p.coefA + 'a + ' + p.coefB + 'b = ' + p.N + '\\). ' +
      '<br><br>This is one equation with two unknowns \u2014 it has a family of positive-integer solutions, not a single answer. ' +
      '<br><br>One valid pair: \\(a = ' + p.a + '\\), \\(b = ' + p.b + '\\), since \\(' + p.coefA + '(' + p.a + ') + ' + p.coefB + '(' + p.b + ') = ' + p.N + '\\). ' +
      '<br><br>So \\(a + b = ' + answer + '\\).'; }},

combinatoricsProperties: {
      // Level 1: two-digit positive integers, digits (1-9) whose product is N \u2192 count ordered pairs
     level1Pool: [{ N: 12, count: 4, sets: [[2,6],[3,4]] },{ N: 8,  count: 4, sets: [[1,8],[2,4]] },{ N: 6,  count: 4, sets: [[1,6],[2,3]] },{ N: 9,  count: 3, sets: [[1,9],[3,3]] },
    { N: 16, count: 3, sets: [[2,8],[4,4]] }, ],
    // Level 2: three-digit positive integers, digits (1-9) whose product is N \u2192 one repeated-digit set + one all-distinct set
    level2Pool: [{ N: 6,  distinctSet: [1,2,3], repeatSet: [1,1,6] },{ N: 20, distinctSet: [1,4,5], repeatSet: [2,2,5] },{ N: 28, distinctSet: [1,4,7], repeatSet: [2,2,7] },{ N: 45, distinctSet: [1,5,9], repeatSet: [3,3,5] },
    { N: 80, distinctSet: [2,5,8], repeatSet: [4,4,5] }, ],
    // Level 3: three-digit positive integers, digits whose product is N AND sum is S \u2192 unique factor set survives
    level3Pool: [{ N: 12, S: 8,  digits: [1,3,4], arrangements: 6 },{ N: 18, S: 10, digits: [1,3,6], arrangements: 6 },{ N: 20, S: 9,  digits: [2,2,5], arrangements: 3 },
    { N: 30, S: 12, digits: [1,5,6], arrangements: 6 },{ N: 45, S: 11, digits: [3,3,5], arrangements: 3 }, ],
    generateProblem(difficulty) { const pool = this['level' + difficulty + 'Pool']; const chosen = pool[Math.floor(Math.random() * pool.length)];
    if (difficulty === 1) { return { ...chosen, difficulty, prompt: 'How many two-digit positive integers have digits whose product is ' + chosen.N + '?' };
    } if (difficulty === 2) { return { ...chosen, difficulty, prompt: 'How many three-digit positive integers have digits whose product is ' + chosen.N + '?' };
    } return { ...chosen, difficulty, prompt: 'How many three-digit positive integers have digits whose product is ' + chosen.N + ' and whose sum is ' + chosen.S + '?' };  },
    correctAnswer(p) { if (p.difficulty === 1) return p.count; if (p.difficulty === 2) { const distinctArr = 6;   // 3! for all-distinct digits
      const repeatArr = 3;     // 3!/2! for one repeated digit
      return distinctArr + repeatArr; } return p.arrangements;},
    distractors(p, answer) { const set = new Set([answer]); let candidates; if (p.difficulty === 1) { candidates = [
        answer - 2,  // counted unordered pairs instead of ordered (forgot ab \u2260 ba)
        answer + 2,  // double-counted a repeated-digit pair
        answer - 1,  // missed one valid pair
      ];  } else if (p.difficulty === 2) {   candidates = [
        12,  // used 3! for both sets, forgot to divide repeated set by 2!
        6,   // only counted the all-distinct set, ignored the repeated-digit set
        3,   // only counted the repeated-digit set, ignored the all-distinct set
      ];  } else {
      const distinctUnique = new Set(p.digits).size === 3;  candidates = [
        distinctUnique ? 3 : 6,  // applied the wrong permutation rule (mixed up distinct vs. repeated)
        p.S,                      // confused the sum constraint with the answer itself
        answer + 6,                // counted an extra factor set that fails the sum check
      ]; }
    const out = [];  for (const cand of candidates) { if (Number.isFinite(cand) && cand > 0 && !set.has(cand)) { set.add(cand); out.push(cand); }
      if (out.length === 3) break;  } return out; },
    explain(p, answer) { if (p.difficulty === 1) {const setsStr = p.sets.map(s => '(' + s[0] + ',' + s[1] + ')').join(' and ');
      return 'Fundamental Counting Principle: find every digit pair (1\u20139) whose product is ' + p.N + ' \u2014 ' + setsStr + '. ' +
        '<br><br>Each pair can be arranged in the tens/units positions in order, since the two digit-slots are already distinct positions. ' +
        '<br><br>Total count: \\(' + answer + '\\).'; } if (p.difficulty === 2) { const [d1,d2,d3] = p.distinctSet;  const [r1,r2,r3] = p.repeatSet;
      return 'Prime factorization backward: find every digit triple (1\u20139) whose product is ' + p.N + '. ' +
        '<br><br>All-distinct set \\(\\{' + d1 + ',' + d2 + ',' + d3 + '\\}\\): \\(3! = 6\\) arrangements. ' +
        '<br><br>Repeated-digit set \\(\\{' + r1 + ',' + r2 + ',' + r3 + '\\}\\): \\(3!/2! = 3\\) arrangements (dividing out the repeat). ' +
        '<br><br>Total: \\(6 + 3 = ' + answer + '\\).'; } const [a,b,c] = p.digits; const isDistinct = new Set(p.digits).size === 3; const rule = isDistinct ? '\\(3! = 6\\)' : '\\(3!/2! = 3\\)';

/* ---------- Level -> eligible propertyTypes ---------- */
const levelMap = {
  1: ['additionProperties', 'isoscelesTriangleProperties', 'functionProperties', 'combinatoricsProperties', 'fractionProperties', 'arithmeticSequenceIdentity', 'modularArithmetic'],
  2: ['additionProperties', 'isoscelesTriangleProperties', 'functionProperties', 'combinatoricsProperties', 'fractionProperties', 'arithmeticSequenceIdentity', 'modularArithmetic'],
  3: ['additionProperties', 'isoscelesTriangleProperties', 'functionProperties', 'combinatoricsProperties', 'fractionProperties', 'arithmeticSequenceIdentity', 'modularArithmetic']
};


const QUESTIONS_PER_LEVEL = 10;
const LETTERS = ['A','B','C','D','E'];

/* ---------- Shuffle helper ---------- */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Session state ---------- */
let currentLevel = 1;
let session = [];
let qIndex = 0;
let topicOrder = [];
let sessionLength = QUESTIONS_PER_LEVEL;

function pickGenerator(level, index) {
  const pool = levelMap[level];
  let propertyType;
  if (index < topicOrder.length) {
    propertyType = topicOrder[index];
  } else {
    propertyType = pool[Math.floor(Math.random() * pool.length)];
  }
  return generators[propertyType];}

function buildQuestion(level, index) {
  const generator = pickGenerator(level, index);
  const problem = generator.generateProblem(level);
  const rawAnswer = generator.correctAnswer(problem);
  const answer = typeof rawAnswer === 'number' ? Math.round(rawAnswer) : rawAnswer;
  const wrongs = generator.distractors(problem, answer);
  const options = [{ val: answer, correct: true }, ...wrongs.map(v => ({ val: v, correct: false }))];
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];}
  return { generator, problem, answer, options, selectedIndex: null };}

function renderQuestion() {
  const q = session[qIndex];
  document.getElementById('qNum').textContent = qIndex + 1;
  document.getElementById('qTotal').textContent = sessionLength;
  document.getElementById('prompt').innerHTML = q.problem.prompt;
  renderMathInElement(document.getElementById('prompt'), {
    delimiters: [{ left: '\\(', right: '\\)', display: false }]
  });

  const eqEl = document.getElementById('promptEquation');
  if (q.problem.latex) {
    eqEl.style.display = 'block';
    renderKatex('promptEquation', q.problem.latex);} 
    else {
    eqEl.style.display = 'none';
    eqEl.innerHTML = '';}

  document.getElementById('feedback').textContent = '';
  document.getElementById('explanation').style.display = 'none';

    const container = document.getElementById('choices');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
    const row = document.createElement('div');
    row.className = 'choice-row';
    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = LETTERS[i];
    const label = document.createElement('div');
    label.style.cssText = 'font-size:18px; color:#002C64;';
    if (q.problem.choices) {
      label.textContent = q.problem.choices[opt.val];
    } else if (opt.val && typeof opt.val === 'object') {
      label.textContent = 'a = ' + opt.val.a + ', b = ' + opt.val.b;
    } else if (typeof opt.val === 'string' && opt.val.includes('\\')) {
      katex.render(opt.val, label, { throwOnError: false });
    } else {
      label.textContent = opt.val;
    }
    row.appendChild(badge);
    row.appendChild(label);

    if (q.selectedIndex !== null) {
      if (i === q.selectedIndex) row.classList.add('selected');
      if (opt.correct) row.classList.add('correct');
            if (opt.correct) {
        const check = document.createElement('div');
        check.className = 'check correct';
        check.innerHTML = '&#10003;';
        row.appendChild(check);
      } else if (i === q.selectedIndex) {
        const check = document.createElement('div');
        check.className = 'check';
        check.style.background = '#cc3333';
        check.innerHTML = '&#10007;';
        row.appendChild(check);
      }}

    row.onclick = function() {
      if (q.selectedIndex !== null) return;
      q.selectedIndex = i;
      const fb = document.getElementById('feedback');
      fb.textContent = opt.correct ? 'Correct.' : 'Not quite. Reveal the explanation to see why.';
      fb.style.color = opt.correct ? '#002C64' : '#999999';
      renderQuestion();};
    container.appendChild(row);});

  document.getElementById('prev-btn').disabled = qIndex === 0;
  document.getElementById('prev-btn').style.opacity = qIndex === 0 ? '0.4' : '1';}

function startLevel(level) {
  currentLevel = level;
  document.getElementById('levelNum').textContent = level;
  topicOrder = shuffle(levelMap[level]);
  sessionLength = Math.max(QUESTIONS_PER_LEVEL, topicOrder.length);
  session = [buildQuestion(level, 0)];
  qIndex = 0;
  renderQuestion();}


document.getElementById('prev-btn').onclick = function() {
  if (qIndex === 0) return;
  qIndex -= 1;
  renderQuestion();};

document.getElementById('next-btn').onclick = function() {
  if (qIndex === session.length - 1 && session.length < sessionLength) {
    session.push(buildQuestion(currentLevel, session.length));}
  if (qIndex < session.length - 1) {
    qIndex += 1;
    renderQuestion();}};

document.getElementById('reveal-btn').onclick = function() {
  const q = session[qIndex];
  const el = document.getElementById('explanation');
  el.innerHTML = q.generator.explain(q.problem, q.answer);
  el.style.display = 'block';
  renderMathInElement(el, { delimiters: [{left: '\\(', right: '\\)', display: false}] });};

function resizeObserver() {
  const height = document.body.scrollHeight;
  window.top.postMessage({ type: 'resize', height }, '*');}
const observer = new ResizeObserver(resizeObserver);
observer.observe(document.body);

let readyInterval = setInterval(() => {
  window.top.postMessage('ready', '*');}, 300);

/* ---------- Read level from URL and start directly ---------- */
const params = new URLSearchParams(window.location.search);
let startingLevel = parseInt(params.get('level'), 10);
if (![1, 2, 3].includes(startingLevel)) startingLevel = 1;
startLevel(startingLevel);
