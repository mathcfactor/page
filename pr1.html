<!DOCTYPE html>

<style>body { background: #ffffff; margin: 0; font-family: 'Open Sans', sans-serif; }
.choice-row { display:flex; align-items:center; gap:14px; padding:16px 18px; border:1px solid #dddddd; border-radius:14px; background:#ffffff; cursor:pointer; margin-bottom:10px; }
.choice-row.selected { border:2px solid #002C64; }
.choice-row.correct { border:2px solid #32CD32; }
.badge { flex:0 0 auto; width:32px; height:32px; border-radius:8px; background:#002C64; color:#ffffff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px; }
.check { margin-left:auto; width:26px; height:26px; border-radius:50%; background:#002C64; color:#ffffff; display:flex; align-items:center; justify-content:center; font-size:14px; }
.check.correct { background:#32CD32; }

@media (max-width: 450px) {

  span:has(#qNum) { font-size: 11px !important; }

}
@media (min-width: 451px) {
  #container { max-width: 600px; margin: 0 auto; }}</style></head>


<body>

<div id="container" style="padding: 1.5rem 1rem;">

<!-- Practice -->
<div id="practiceStrip">
<div style="display:flex; justify-content:space-between; align-items:center; margin: 0 0.2rem 1.2rem 0rem;">
<span style="font-size:16px; color:#999999; font-weight:500;">Question <span id="qNum">1</span> of <span id="qTotal">10</span></span>
<span id="levelLabel" style="color:#777777; font-size:13px; font-weight:600;">Level <span id="levelNum">1</span></span></div>


<div id="prompt" style="text-align: left; font-size: 20px; font-weight: 500; color: #002C64; margin: 0 0 1rem 0; line-height: 1.5;"></div>

<button id="prev-btn" style="padding:12px 20px; border:1px solid #aaaaaa; border-radius:10px; background:#ffffff; cursor:pointer; color:#888888; font-size:15px;">&larr; Previous</button>
<button id="next-btn" style="padding:12px 20px; border:none; border-radius:10px; background:#002C64; cursor:pointer; color:#ffffff; font-size:15px; font-weight:500;">Next &rarr;</button></div></div></div>
<button id="reveal-btn" style="display:block; margin: 0 auto 1.5rem auto; padding:8px 14px; border:1px solid #dddddd; border-radius:10px; background:#ffffff; cursor:pointer; color:#888888; font-size:13px;">Reveal explanation</button>
<div id="explanation" style="display: none; margin-bottom: 1.5rem; padding: 1rem 1.1rem; background: #f9f9f9; border-radius: 12px; font-size: 15px; color: #555555; line-height: 1.5;"></div>


<script>
function renderKatex(id, latex) {
  katex.render(latex, document.getElementById(id), { throwOnError: false, displayMode: true });}

/* ---------- Generators (same interface as p1.html) ---------- */
const generators = {
  
additionProperties: {pools: {1: [[1,50],[2,50],[1,40],[5,50],[1,100]],2: [[2,20,'even'],[1,19,'odd'],[10,30,'even'],[1,29,'odd'],[4,40,'even']],
    3: [[1,30,3],[1,40,4],[1,50,5],[1,60,3],[1,80,4]]},

    generateProblem(difficulty) {const pool = this.pools[difficulty];const params = pool[Math.floor(Math.random() * pool.length)];
    if (difficulty === 1) {const [start, end] = params;return { difficulty, start, end,prompt: `What is the sum of all integers from ${start} through ${end}, inclusive?` };
    }
    if (difficulty === 2) {const [start, end, parity] = params;return { difficulty, start, end, parity,prompt: `What is the sum of all ${parity} integers from ${start} through ${end}, inclusive?` };
    }
    const [start, end, k] = params;return { difficulty, start, end, k,prompt: `What is the sum of all multiples of ${k} from ${start} through ${end}, inclusive?` };
  },

  // --- helpers ---
  boundsFor(p) {if (p.difficulty === 1) return { first: p.start, last: p.end, step: 1 };if (p.difficulty === 2) {
      const wantEven = p.parity === 'even';const first = (p.start % 2 === 0) === wantEven ? p.start : p.start + 1;const last = (p.end % 2 === 0) === wantEven ? p.end : p.end - 1;
      return { first, last, step: 2 };
    }
    const first = Math.ceil(p.start / p.k) * p.k;const last = Math.floor(p.end / p.k) * p.k;return { first, last, step: p.k };
  },
  correctAnswer(p) {const { first, last, step } = this.boundsFor(p);const n = Math.floor((last - first) / step) + 1;return (n / 2) * (first + last);
  },
  distractors(p, answer) {const { first, last, step } = this.boundsFor(p);const n = Math.floor((last - first) / step) + 1;
    if (p.difficulty === 1) {
      return [
        Math.round(((n - 1) / 2) * (p.start + p.end)),   // off-by-one on count
        Math.round(p.start + p.end),                       // forgot to multiply by pairs
        Math.round(answer + (p.start + p.end) / 2)          // extra half-pair added
      ];
    }
    if (p.difficulty === 2) {
      const nAll = Math.floor((p.end - p.start) / 1) + 1;
      return [
        Math.round((nAll / 2) * (p.start + p.end)),         // forgot to filter parity
        Math.round(answer - first),                          // off-by-one on first qualifying term
        Math.round(answer - step)                            // off-by-one on last qualifying term
      ];
    }
    return [
      Math.round((n / 2) * ((n - 1) * step)),               // wrong step used in pairing
      Math.round(answer - first),                            // forgot to snap start up
      Math.round(answer + (p.end - last))                    // used raw endpoint instead of snapped last
    ];
  },

  explain(p, answer) {
    const { first, last, step } = this.boundsFor(p);
    const n = Math.floor((last - first) / step) + 1;
    if (p.difficulty === 1) {
      return `Pair the first and last: ${p.start} + ${p.end} = ${p.start + p.end}. ` +
        `There are ${n} numbers, forming ${n / 2} pairs. Sum = ${n / 2} &times; ${p.start + p.end} = ${answer}.`;
    }
    if (p.difficulty === 2) {
      return `First isolate the qualifying ${p.parity} terms: first is ${first}, last is ${last}. ` +
        `Step size is 2, so there are ${n} terms. Pair ends inward: ${first} + ${last} = ${first + last}, ` +
        `giving ${n / 2} pairs. Sum = ${n / 2} &times; ${first + last} = ${answer}.`;
    }
    return `Snap the range to multiples of ${p.k}: first is ${first}, last is ${last}. ` +
      `This is a scaled arithmetic sequence (step = ${p.k}) with ${n} terms &mdash; ` +
      `pull out a factor of ${p.k} and it reduces to the same pairing insight. ` +
      `Sum = ${n / 2} &times; ${first + last} = ${answer}.`;}},



  exponentProperties: {level1Pool: [{ b: 2, k: 2, x: 2, N: 64 },{ b: 2, k: 2, x: 3, N: 512 },{ b: 2, k: 3, x: 2, N: 256 },{ b: 3, k: 2, x: 2, N: 729 }],
    level2Pool: [{ b: 2, k: 1, c: 2, x: 2, N: 64 },{ b: 2, k: 1, c: 2, x: 3, N: 512 },{ b: 2, k: 1, c: 3, x: 2, N: 256 },{ b: 2, k: 2, c: 2, x: 2, N: 1024 },{ b: 3, k: 1, c: 2, x: 2, N: 729 }],
    level3Pool: [{ b: 2, c: 2, n: 2, x: 2, N: 256 },{ b: 2, c: 2, n: 3, x: 2, N: 512 },{ b: 2, c: 2, n: 4, x: 1, N: 128 },{ b: 2, c: 2, n: 4, x: 2, N: 1024 },{ b: 2, c: 3, n: 2, x: 2, N: 1024 },
    { b: 2, c: 3, n: 3, x: 1, N: 128 },{ b: 2, c: 3, n: 4, x: 1, N: 256 },{ b: 3, c: 2, n: 2, x: 1, N: 243 },{ b: 3, c: 2, n: 3, x: 1, N: 729 },{ b: 3, c: 2, n: 4, x: 1, N: 2187 },
    { b: 3, c: 3, n: 2, x: 1, N: 729 },{ b: 3, c: 3, n: 3, x: 1, N: 2187 },{ b: 4, c: 2, n: 2, x: 1, N: 1024 }],
    generateProblem(difficulty) {
      const pool = this['level' + difficulty + 'Pool'];const chosen = pool[Math.floor(Math.random() * pool.length)];const { b, x, N } = chosen;
      const k = chosen.k ?? null;const c = chosen.c ?? null;const n = chosen.n ?? null;const hasC = difficulty === 2;const hasN = difficulty === 3;const secondBase = k !== null ? Math.pow(b, k) : null;

      let prompt, latex;
      if (hasN) {prompt = 'Find the value of x:';latex = b + '^x \\cdot ' + b + '^{' + c + 'x+' + n + '} = ' + N;} 
        else if (hasC) {prompt = 'Find the value of x:';latex = b + '^x \\cdot ' + secondBase + '^{' + c + 'x} = ' + N;} 
        else {prompt = 'Find the value of x:';latex = b + '^x \\cdot ' + secondBase + '^{x} = ' + N;}
      return { b, k, c, n, x, secondBase, N, hasC, hasN, prompt, latex };},
    correctAnswer(p) { return p.x; },
    distractors(p, answer) {const set = new Set([answer]);let candidates;
      if (p.hasN) {const m = 1 + p.c;const ignoredN = Math.round((m * p.x + p.n) / m);candidates = [ignoredN, answer + 1, answer - 1, answer + 2, p.x + p.n];} 
        else {const m = p.hasC ? 1 + p.k * p.c : 1 + p.k;const ignoredKC = Math.round((m * p.x) / 2);
        candidates = [ignoredKC, answer + 1, answer - 1, answer + 2, answer + m];}
      const out = [];for (const cand of candidates) {
        if (cand > 0 && !set.has(cand)) { set.add(cand); out.push(cand); }
        if (out.length === 3) break;}
      return out;},

    explain(p, answer) {if (p.hasN) {
        const m = 1 + p.c;
        const totalExp = m * answer + p.n;
        return 'Combine exponents: \\(' + p.b + '^x \\cdot ' + p.b + '^{' + p.c + 'x+' + p.n + '} = ' +
         p.b + '^{(1+' + p.c + ')x+' + p.n + '} = ' + p.b + '^{' + m + 'x+' + p.n + '}\\). ' +
          'Set equal: \\(' + m + 'x+' + p.n + ' = ' + totalExp + '\\) (since \\(' + p.N + ' = ' + p.b + '^{' + totalExp + '}\\)). ' +
         'Solving: \\(x = ' + answer + '\\).';}
         if (p.hasC) {
         const m = 1 + p.k * p.c;
         return 'Rewrite \\(' + p.secondBase + '\\) as \\(' + p.b + '^' + p.k + '\\), so the equation becomes \\(' +
         p.b + '^x \\cdot (' + p.b + '^' + p.k + ')^{' + p.c + 'x} = ' + p.N + '\\). ' +
         'Apply the power rule: \\((' + p.b + '^' + p.k + ')^{' + p.c + 'x} = ' + p.b + '^{' + (p.k * p.c) + 'x}\\). ' +
        'Now add exponents: \\(' + p.b + '^{' + m + 'x} = ' + p.N + ' = ' + p.b + '^{' + (m * answer) + '}\\). ' +
        'Matching exponents: \\(' + m + 'x = ' + (m * answer) + '\\), so \\(x = ' + answer + '\\).';}
        const m = 1 + p.k;
        return 'Rewrite \\(' + p.secondBase + '\\) as \\(' + p.b + '^' + p.k + '\\), so the equation becomes \\(' +
        p.b + '^x \\cdot ' + p.b + '^{' + p.k + 'x} = ' + p.N + '\\). Add exponents: \\(' + p.b + '^{' +
        m + 'x} = ' + p.N + ' = ' + p.b + '^{' + (m * answer) + '}\\). Matching exponents: \\(' + m +
        'x = ' + (m * answer) + '\\), so \\(x = ' + answer + '\\).';}},


  logProperties: {level1Pool: [{ b: 6, A: 12, k: 3, x: 18 },{ b: 6, A: 4, k: 2, x: 9 },{ b: 4, A: 8, k: 3, x: 8 },{ b: 10, A: 4, k: 2, x: 25 }, { b: 12, A: 8, k: 2, x: 18 }],
    level2Pool: [{ b: 6, c: 2, A: 24, k: 3, x: 3 },{ b: 10, c: 2, A: 25, k: 2, x: 2 },{ b: 12, c: 2, A: 36, k: 2, x: 2 },{ b: 6, c: 3, A: 27, k: 3, x: 2 },{ b: 6, c: 2, A: 9, k: 2, x: 2 }],
    level3Pool: [{ b: 2, m: 3, A: 16, j: 4, k: 4, coeff: 4, root: 3, radicand: 4,wrongSkip: 1, wrongSign: '32\\sqrt[3]{2}', wrongSplit: '2\\sqrt[3]{16}' },
    { b: 3, m: 2, A: 27, j: 3, k: 5, coeff: 27, root: 2, radicand: 3,wrongSkip: 9, wrongSign: '81\\sqrt{3}', wrongSplit: '9\\sqrt{3}' },
    { b: 2, m: 2, A: 32, j: 5, k: 6, coeff: 8, root: 2, radicand: 2,wrongSkip: 2, wrongSign: '32\\sqrt{2}', wrongSplit: '4\\sqrt{2}' },
    { b: 5, m: 2, A: 125, j: 3, k: 4, coeff: 25, root: 2, radicand: 5,wrongSkip: 5, wrongSign: '125\\sqrt{5}', wrongSplit: '5\\sqrt{5}' },
    { b: 3, m: 3, A: 81, j: 4, k: 3, coeff: 3, root: 3, radicand: 9,wrongSkip: 1, wrongSign: '9\\sqrt[3]{9}', wrongSplit: '\\sqrt[3]{9}' }],

  generateProblem(difficulty) {
    const pool = this['level' + difficulty + 'Pool'];
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    let latex;
    if (difficulty === 1) {
      latex = '\\log_{' + chosen.b + '}x + \\log_{' + chosen.b + '}' + chosen.A + ' = ' + chosen.k;
    } else if (difficulty === 2) {
      latex = chosen.c + '\\log_{' + chosen.b + '}x + \\log_{' + chosen.b + '}' + chosen.A + ' = ' + chosen.k;
    } else {
      const bm = Math.pow(chosen.b, chosen.m);
      latex = '\\log_{' + chosen.b + '}x + \\log_{' + bm + '}' + chosen.A + ' = ' + chosen.k;
    }
    return { ...chosen, difficulty, prompt: 'Find the value of x:', latex };},

  correctAnswer(p) {
    if (p.difficulty === 3) {
      const radStr = (p.root === 2 ? '\\sqrt{' : '\\sqrt[3]{') + p.radicand + '}';
      return p.coeff + radStr;
    }
    return p.x;},

  distractors(p, answer) {
    if (p.difficulty === 1) {
      return [
        Math.round(Math.pow(p.b, p.k) - p.A),
        Math.round(p.A - Math.pow(p.b, p.k)),
        Math.round(p.x + p.A)];}
    if (p.difficulty === 2) {
      const xc = Math.pow(p.x, p.c);
      return [
        Math.round(xc),
        Math.round(p.x + 1),
        Math.round((Math.pow(p.b, p.k) - p.A) / p.c)];}
    return [p.wrongSkip, p.wrongSign, p.wrongSplit];},

  explain(p, answer) {
    if (p.difficulty === 1) {
      return 'Product of logs identity: \\(\\log_{' + p.b + '}(' + p.A + 'x) = ' + p.k +
        '\\). <br><br>Definition of logs: \\(' + p.A + 'x = ' + p.b + '^{' + p.k + '} = ' +
        Math.pow(p.b, p.k) + '\\). <br><br>Solve: \\(x = ' + p.x + '\\).';}
    if (p.difficulty === 2) {
      return 'Apply the power rule first: \\(' + p.c + '\\log_{' + p.b + '}x = \\log_{' + p.b +
        '}x^{' + p.c + '}\\). Now combine: \\(\\log_{' + p.b + '}(' + p.A + 'x^{' + p.c + '}) = ' +
        p.k + '\\). Convert: \\(' + p.A + 'x^{' + p.c + '} = ' + p.b + '^{' + p.k + '} = ' +
        Math.pow(p.b, p.k) + '\\), so \\(x^{' + p.c + '} = ' + Math.pow(p.x, p.c) + '\\), giving \\(x = ' + p.x + '\\).';}
    const bm = Math.pow(p.b, p.m);
    const frac = p.j + '/' + p.m;
    const radStr = (p.root === 2 ? '\\sqrt{' : '\\sqrt[3]{') + p.radicand + '}';
    return 'Since \\(' + bm + ' = ' + p.b + '^{' + p.m + '}\\), rewrite \\(\\log_{' + bm + '}' + p.A +
      '\\) directly in base ' + p.b + ': \\(\\log_{' + bm + '}' + p.A + ' = \\log_{' + p.b + '^{' + p.m +
      '}}' + p.b + '^{' + p.j + '} = ' + frac + '\\). Substitute: \\(\\log_{' + p.b + '}x + ' + frac +
      ' = ' + p.k + '\\), so \\(\\log_{' + p.b + '}x = ' + p.k + ' - ' + frac + '\\). Convert to exponential form and simplify the fractional exponent: \\(x = ' +
      p.coeff + radStr + '\\).';}},


  multiplicationProperties: {
    level1Pool: [{ a: 3, b: 4 },{ a: 5, b: 6 },{ a: 4, b: 9 },{ a: 6, b: -2 },{ a: 8, b: 7 }],
    level2Pool: [{ c: 2, m: 6, N: 48 },{ c: 7, m: 3, N: 63 },{ c: 2, m: 3, N: 30 },{ c: 3, m: 2, N: 42 },{ c: 2, m: 5, N: 90 }],
    level3Pool: [{ c: 4, d1: 3, d2: 6, N: 108, v1: 'x', v2: 'y' },{ c: 2, d1: 3, d2: 7, N: 100, v1: 'm', v2: 'n' },{ c: 3, d1: 2, d2: 5, N: 42, v1: 'a', v2: 'b' },{ c: 3, d1: 1, d2: 3, N: 72, v1: 'a', v2: 'b' },{ c: 4, d1: 1, d2: 2, N: 96, v1: 'a', v2: 'b' }],
    generateProblem(difficulty) {
    const pool = this['level' + difficulty + 'Pool'];
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    if (difficulty === 1) {const { a, b } = chosen;const sign = b >= 0 ? '+ ' + b : '\u2212 ' + Math.abs(b);
      return { ...chosen, difficulty, prompt: 'Find the value of k:', latex: a + '(n ' + sign + ') = ' + a + 'n + k' };}
    if (difficulty === 2) {const { c, m, N } = chosen;
      return { ...chosen, difficulty, prompt: 'Given xy = ' + m + ', find the value of k:', latex: '(kx)(' + c + 'y) = ' + N };}
    const { c, d1, d2, N, v1, v2 } = chosen;
    return { ...chosen, difficulty, prompt: 'Find the value of ' + v1 + v2 + ':', latex: '(' + c + v1 + ')(' + d1 + v2 + ') + (' + c + v1 + ')(' + d2 + v2 + ') = ' + N };},
  correctAnswer(p) {
    if (p.difficulty === 1) return p.a * p.b;
    if (p.difficulty === 2) return p.N / (p.c * p.m);
    return p.N / (p.c * (p.d1 + p.d2));},
  distractors(p, answer) {
    const set = new Set([answer]);
    let candidates;
    if (p.difficulty === 1) {
      candidates = [p.b, p.a + p.b, -answer, answer + p.a, p.a - p.b];
    } else if (p.difficulty === 2) {
      candidates = [Math.round(p.N / p.c), Math.round(p.N / p.m), Math.round(p.N / (p.c + p.m)), p.c * p.m, Math.round(p.N / (p.c * p.m + 1))];
    } else {
      candidates = [Math.round(p.N / (p.d1 + p.d2)),Math.round(p.N / (p.c * p.d2)),Math.round(p.N / (p.c * p.d1)),Math.round(p.N / (p.c * p.d1 * p.d2)),
        p.d1 + p.d2,
      ];
    }
    const out = [];
    for (const cand of candidates) {
      if (Number.isFinite(cand) && cand !== 0 && !set.has(cand)) { set.add(cand); out.push(cand);}
      if (out.length === 3) break;}
    return out;},
  explain(p, answer) {
    if (p.difficulty === 1) {
      return 'The ' + p.a + ' outside the parentheses multiplies every term inside: \\(' + p.a + '(n) + ' + p.a + '(' + p.b +
        ')\\). The right side already shows \\(' + p.a + 'n\\), so the remaining piece is \\(' + p.a + ' \\times ' + p.b + ' = ' + answer + '\\).';}
    if (p.difficulty === 2) {
      return 'Regroup the factors: \\((kx)(' + p.c + 'y) = ' + p.c + 'k(xy) = ' + p.c + 'k(' + p.m + ') = ' + (p.c * p.m) +
        'k\\). Setting this equal to \\(' + p.N + '\\) gives \\(' + (p.c * p.m) + 'k = ' + p.N + '\\), so \\(k = ' + answer + '\\).';}
    const sum = p.d1 + p.d2;
    return 'Factor out the shared ' + p.c + p.v1 + ': \\(' + p.c + p.v1 + '(' + p.d1 + p.v2 + ' + ' + p.d2 + p.v2 + ') = ' + p.c + p.v1 +
      '(' + sum + p.v2 + ') = ' + (p.c * sum) + p.v1 + p.v2 + '\\). Setting this equal to \\(' + p.N + '\\) gives \\(' + (p.c * sum) +
      p.v1 + p.v2 + ' = ' + p.N + '\\), so \\(' + p.v1 + p.v2 + ' = ' + answer + '\\).';}}, 
    
    isoscelesTriangleProperties: {
      // Level 1: \u2220A \u2245 \u2220C, \u2220B given \u2192 Angle Sum Theorem
      level1Pool: [{ B: 20 },{ B: 40 },{ B: 60 },{ B: 80 },{ B: 100 },{ B: 120 },{ B: 140 },{ B: 44 },{ B: 64 },{ B: 84 },{ B: 104 }],

      // Level 2: \u2220A \u2245 \u2220C, exterior \u2220B given \u2192 Exterior Angle Theorem
      level2Pool: [{ extB: 40 },{ extB: 60 },{ extB: 80 },{ extB: 100 },{ extB: 120 },{ extB: 44 },{ extB: 68 },{ extB: 76 },{ extB: 92 },{ extB: 108 },{ extB: 124 }],

function buildQuestion(level) {
  const generator = pickGenerator(level);

  });

  const eqEl = document.getElementById('promptEquation');
  if (q.problem.latex) {
    eqEl.style.display = 'block';
    renderKatex('promptEquation', q.problem.latex);} 
    else {
    eqEl.style.display = 'none';
    eqEl.innerHTML = '';}

  document.getElementById('feedback').textContent = '';
  document.getElementById('explanation').style.display = 'none';

    const container = document.getElementById('choices');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
    const row = document.createElement('div');
    row.className = 'choice-row';
    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = LETTERS[i];
    const label = document.createElement('div');
    label.style.cssText = 'font-size:18px; color:#002C64;';
    if (q.problem.choices) {
      label.textContent = q.problem.choices[opt.val];
    } else if (opt.val && typeof opt.val === 'object') {
      label.textContent = 'a = ' + opt.val.a + ', b = ' + opt.val.b;
    } else if (typeof opt.val === 'string' && opt.val.includes('\\')) {
      katex.render(opt.val, label, { throwOnError: false });
    } else {
      label.textContent = opt.val;
    }
    row.appendChild(badge);
    row.appendChild(label);

    if (q.selectedIndex !== null) {
      if (i === q.selectedIndex) row.classList.add('selected');
      if (opt.correct) row.classList.add('correct');
            if (opt.correct) {
        const check = document.createElement('div');
        check.className = 'check correct';
        check.innerHTML = '&#10003;';
        row.appendChild(check);
      } else if (i === q.selectedIndex) {
        const check = document.createElement('div');
        check.className = 'check';
        check.style.background = '#cc3333';
        check.innerHTML = '&#10007;';
        row.appendChild(check);
      }}

    row.onclick = function() {
      if (q.selectedIndex !== null) return;
      q.selectedIndex = i;
      const fb = document.getElementById('feedback');
      fb.textContent = opt.correct ? 'Correct.' : 'Not quite. Reveal the explanation to see why.';
      fb.style.color = opt.correct ? '#002C64' : '#999999';
      renderQuestion();};
    container.appendChild(row);});

  document.getElementById('prev-btn').disabled = qIndex === 0;
  document.getElementById('prev-btn').style.opacity = qIndex === 0 ? '0.4' : '1';}

function startLevel(level) {
  currentLevel = level;
  document.getElementById('levelNum').textContent = level;
  session = [buildQuestion(level)];
  qIndex = 0;
  renderQuestion();}


document.getElementById('prev-btn').onclick = function() {
  if (qIndex === 0) return;
  qIndex -= 1;
  renderQuestion();};

document.getElementById('next-btn').onclick = function() {
  if (qIndex === session.length - 1 && session.length < QUESTIONS_PER_LEVEL) {
    session.push(buildQuestion(currentLevel));}
  if (qIndex < session.length - 1) {
    qIndex += 1;
    renderQuestion();}};

document.getElementById('reveal-btn').onclick = function() {
  const q = session[qIndex];
  const el = document.getElementById('explanation');
  el.innerHTML = q.generator.explain(q.problem, q.answer);
  el.style.display = 'block';
  renderMathInElement(el, { delimiters: [{left: '\\(', right: '\\)', display: false}] });};

function resizeObserver() {
  const height = document.body.scrollHeight;
  window.top.postMessage({ type: 'resize', height }, '*');}
const observer = new ResizeObserver(resizeObserver);
observer.observe(document.body);

let readyInterval = setInterval(() => {
  window.top.postMessage('ready', '*');}, 300);

/* ---------- Read level from URL and start directly ---------- */
const params = new URLSearchParams(window.location.search);
let startingLevel = parseInt(params.get('level'), 10);
if (![1, 2, 3].includes(startingLevel)) startingLevel = 1;
startLevel(startingLevel);
</script>
